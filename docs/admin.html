<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>アーカイブ班 承認台</title>
<style>
:root{--bg:#0f1a2b;--panel:#16243a;--line:#2a3c58;--ink:#e9e2d0;--dim:#9aa6b8;--lamp:#f0c86e;--ok:#7fc7a0;--ng:#e98b7b}
:root[data-theme="light"]{--bg:#f6f2e8;--panel:#fffdf7;--line:#ddd3bf;--ink:#22252b;--dim:#666b74;--lamp:#a8741a;--ok:#2f7d55;--ng:#b0442f}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f2e8;--panel:#fffdf7;--line:#ddd3bf;--ink:#22252b;--dim:#666b74;--lamp:#a8741a;--ok:#2f7d55;--ng:#b0442f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 8px;display:flex;gap:8px;align-items:baseline}
h2 small{color:var(--dim);font-weight:400;font-size:12px}
p.note{color:var(--dim);font-size:13px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta{color:var(--dim);font-size:12px}
button,input{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
button:hover{border-color:var(--lamp)}
button.ok{border-color:var(--ok);color:var(--ok)}
button.ng{border-color:var(--ng);color:var(--ng)}
input[type=email]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;flex:1}
.ids{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.stat b{display:block;font-size:20px}
.empty{color:var(--dim);font-size:13px;padding:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>アーカイブ班 承認台</h1>
  <p class="note">公開ページに届いた書き込みを確かめて、表に出すものを決める場所です。ここで承認したものだけが公開ページに出ます。</p>

  <section id="login">
    <div class="card">
      <p style="margin-top:0">班のメンバーとして登録したメールアドレスを入れてください。ログイン用のリンクが届きます。</p>
      <form class="row" id="loginForm"><input type="email" id="email" required placeholder="you@example.com" autocomplete="email"><button type="submit">リンクを送る</button></form>
      <p class="meta" id="loginMsg"></p>
    </div>
  </section>

  <section id="desk" hidden>
    <div class="row" style="justify-content:space-between"><span class="meta" id="who"></span><button id="logout" type="button">ログアウト</button></div>
    <h2>まとめの使用量</h2>
    <div class="stats" id="stats"></div>

    <h2>手がかり <small>承認すると「班で確かめた手がかり」として公開</small></h2>
    <div id="discs"></div>

    <h2>場所の手がかり <small>公開はされません。地図の位置を決める参考に</small></h2>
    <div id="hints"></div>

    <h2>検索された言葉 <small>承認した言葉だけが「いま町で調べられている言葉」に出ます</small></h2>
    <div id="terms"></div>

    <h2>みんなの散歩道 <small>資料IDの並びだけなので自動で公開。不自然なものは隠せます</small></h2>
    <div id="walks"></div>
  </section>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const C = window.FK_CONFIG || {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = (t) => new Date(t).toLocaleString("ja-JP", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
if (!C.supabaseUrl || !window.supabase) { $("loginMsg").textContent = "config.js に Supabase の設定がまだ入っていません。"; }
const sb = C.supabaseUrl && window.supabase ? window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey) : null;

$("loginForm").onsubmit = async (e) => {
  e.preventDefault(); if (!sb) return;
  const { error } = await sb.auth.signInWithOtp({ email: $("email").value.trim(), options: { emailRedirectTo: location.href.split("#")[0], shouldCreateUser: true } });
  $("loginMsg").textContent = error ? "送れませんでした：" + error.message : "リンクを送りました。メールを開いてリンクを押してください。";
};
$("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function setStatus(table, match, status) {
  const { error } = await sb.from(table).update({ status }).match(match);
  if (error) alert("変更できませんでした：" + error.message); else load();
}
function actions(table, match, status) {
  const m = esc(JSON.stringify(match));
  return `<div class="row">${status !== "approved" ? `<button class="ok" data-t="${table}" data-m="${m}" data-s="approved">承認</button>` : ""}${status !== "rejected" ? `<button class="ng" data-t="${table}" data-m="${m}" data-s="rejected">${status === "approved" ? "隠す" : "却下"}</button>` : ""}<span class="meta">${({pending:"確認待ち", approved:"公開中", rejected:"非公開"})[status] || status}</span></div>`;
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (b) setStatus(b.dataset.t, JSON.parse(b.dataset.m), b.dataset.s); });

async function load() {
  const [u, d, h, t, w] = await Promise.all([
    sb.rpc("fk_usage_summary"),
    sb.from("discoveries").select("*").order("status").order("at", { ascending: false }).limit(60),
    sb.from("place_hints").select("*").order("at", { ascending: false }).limit(60),
    sb.from("search_terms").select("*").order("status").order("first_at", { ascending: false }).limit(120),
    sb.from("walks").select("*").order("at", { ascending: false }).limit(30),
  ]);
  if (d.error && /permission|row-level/i.test(d.error.message)) { $("desk").innerHTML = `<p class="note">このメールアドレスは班のメンバーに登録されていません。登録はSupabaseの editors 表で行います。</p>`; return; }
  const s = u.data || {};
  $("stats").innerHTML = `<div class="stat"><b>${s.today ?? "-"}</b>きょう</div><div class="stat"><b>${s.month ?? "-"}</b>今月</div><div class="stat"><b>${s.cached ?? "-"}</b>しまってある答え</div>`;
  $("discs").innerHTML = (d.data || []).map((x) => `<div class="card"><strong>${esc(x.title)}</strong><div>${esc(x.body)}</div><div class="ids">根拠：${esc((x.ids || []).join("、"))}</div><div class="meta">${when(x.at)}</div>${actions("discoveries", {id: x.id}, x.status)}</div>`).join("") || `<div class="empty">まだありません。</div>`;
  $("hints").innerHTML = (h.data || []).map((x) => `<div class="card"><span class="ids">${esc(x.rec_id)}</span>　${esc(x.text)}<div class="meta">${when(x.at)}</div>${actions("place_hints", {id: x.id}, x.status)}</div>`).join("") || `<div class="empty">まだありません。</div>`;
  $("terms").innerHTML = (t.data || []).map((x) => `<div class="card row" style="justify-content:space-between"><span>${esc(x.q)}</span>${actions("search_terms", {q: x.q}, x.status)}</div>`).join("") || `<div class="empty">まだありません。</div>`;
  $("walks").innerHTML = (w.data || []).map((x) => `<div class="card"><span class="ids">${esc((x.ids || []).join(" → "))}</span><div class="meta">${when(x.at)}</div>${actions("walks", {id: x.id}, x.status)}</div>`).join("") || `<div class="empty">まだありません。</div>`;
}

if (sb) sb.auth.onAuthStateChange((_ev, session) => {
  const inside = !!session;
  $("login").hidden = inside; $("desk").hidden = !inside;
  if (inside) { $("who").textContent = session.user.email + " でログイン中"; load(); }
});
</script>
</body>
</html>
